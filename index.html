<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AG.INV Invoicing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f27;--mute:#6b7280;--bd:#e3e6ea;--ac:#0b4700;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eceef2;--mute:#9aa1ad;--bd:#2c313a;--ac:#3fa34d}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eceef2;--mute:#9aa1ad;--bd:#2c313a;--ac:#3fa34d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{padding:16px 16px 8px}
.logo{display:inline-block;background:#fff;border-radius:12px;padding:10px 14px;border:1px solid var(--bd)}.logo img{height:34px;display:block}
.sub{color:var(--mute);font-size:13px}
nav{display:flex;gap:6px;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{padding:0 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.item{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.item .row input{padding:9px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.x{background:none;border:0;color:#d33;font-size:13px;padding:6px 0}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.tot.big{font-size:20px;font-weight:700;border-top:1px solid var(--bd);margin-top:6px;padding-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bar .btn{margin:0;max-width:608px;display:block;margin:0 auto}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg{position:fixed;left:16px;right:16px;bottom:84px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;text-align:center;font-size:14px;display:none;z-index:9}
.hide{display:none}
</style>
</head>

 <div class="card"><b>Items</b><div id="items"></div><button class="btn ghost" id="add">+ Add item</button></div>
 <div class="card"><label style="margin-top:0">Notes</label><textarea id="nt" placeholder="Thank you for your business"></textarea>
  <div style="margin-top:12px"><div class="tot"><span>Subtotal</span><span id="st"></span></div><div class="tot"><span>Tax</span><span id="tx"></span></div><div class="tot big"><span>Total</span><span id="gt"></span></div></div>
 </div>
</section>
<section id="biz" class="hide">
 <div class="card">
  <label style="margin-top:0">Business name</label><input id="bn" placeholder="Your business">
  <label>Address</label><textarea id="ba"></textarea>
  <div class="row"><div><label>Email</label><input id="be" type="email"></div><div><label>Phone</label><input id="bp" type="tel"></div></div>
  <div class="row"><div><label>Currency code</label><input id="bc" maxlength="4"></div><div><label>Default tax %</label><input id="bt" type="number" inputmode="decimal"></div></div>
  <label>Payment details</label><textarea id="bd" placeholder="Bank, account name, account number"></textarea>
  <label>Brand colour</label><input id="bk" type="color" style="height:46px;padding:4px">
  <button class="btn" id="sv">Save business profile</button>
 </div>
</section>
<section id="his" class="hide"><div id="hl"></div></section>
</main>
<div class="bar" id="bar"><button class="btn" id="pdf">Create PDF &amp; share</button></div>
<div class="msg" id="msg"></div>
<script>
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let biz=ld('ip_biz2',{name:'AG.INV',addr:'',email:'',phone:'',cur:'NGN',tax:0,pay:'',col:'#0b4700'});
let hist=ld('ip_hist',[]);
let seq=ld('ip_seq',1);
const today=()=>new Date().toISOString().slice(0,10);
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
let items=[{d:'',q:1,p:0}];
const fmt=n=>(biz.cur||'')+' '+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3200)}
function newInv(){$('no').value='INV-'+String(seq).padStart(4,'0');$('dt').value=today();$('due').value=plus(14);$('tax').value=biz.tax||0;$('cl').value='';$('ca').value='';$('nt').value='';items=[{d:'',q:1,p:0}];draw()}
function totals(){const s=items.reduce((a,i)=>a+(+i.q||0)*(+i.p||0),0);const t=s*(+$('tax').value||0)/100;return{s,t,g:s+t}}
function draw(){
 $('items').innerHTML=items.map((it,i)=>`<div class="item"><input data-i="${i}" data-k="d" placeholder="Description" value="${(it.d||'').replace(/"/g,'&quot;')}"><div class="row" style="margin-top:6px"><input data-i="${i}" data-k="q" type="number" inputmode="decimal" placeholder="Qty" value="${it.q}"><input data-i="${i}" data-k="p" type="number" inputmode="decimal" placeholder="Price" value="${it.p||''}"></div><button class="x" data-r="${i}">Remove</button></div>`).join('');
 calc()}
function calc(){const t=totals();$('st').textContent=fmt(t.s);$('tx').textContent=fmt(t.t);$('gt').textContent=fmt(t.g)}
$('items').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;items[e.target.dataset.i][k]=e.target.value;calc()});
$('items').addEventListener('click',e=>{const r=e.target.dataset.r;if(r!==undefined){items.splice(+r,1);if(!items.length)items=[{d:'',q:1,p:0}];draw()}});
$('add').onclick=()=>{items.push({d:'',q:1,p:0});draw()};
$('tax').oninput=calc;
function loadBiz(){$('bn').value=biz.name;$('ba').value=biz.addr;$('be').value=biz.email;$('bp').value=biz.phone;$('bc').value=biz.cur;$('bt').value=biz.tax;$('bd').value=biz.pay;$('bk').value=biz.col;document.documentElement.style.setProperty('--ac',biz.col)}
$('sv').onclick=()=>{biz={name:$('bn').value.trim(),addr:$('ba').value,email:$('be').value,phone:$('bp').value,cur:($('bc').value||'NGN').toUpperCase(),tax:+$('bt').value||0,pay:$('bd').value,col:$('bk').value};sv('ip_biz2',biz);loadBiz();$('tax').value=biz.tax;calc();toast('Business profile saved')};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['inv','biz','his'].forEach(s=>$(s).classList.toggle('hide',s!==b.dataset.t));$('bar').classList.toggle('hide',b.dataset.t!=='inv');if(b.dataset.t==='his')drawHist()});
function snap(){return{no:$('no').value,dt:$('dt').value,due:$('due').value,tax:+$('tax').value||0,cl:$('cl').value,ca:$('ca').value,nt:$('nt').value,items:items.filter(i=>i.d||+i.p),tot:totals().g}}
function drawHist(){$('hl').innerHTML=hist.length?hist.map((h,i)=>`<div class="card hist"><div><b>${h.no}</b><div class="sub">${h.cl||'No client'} · ${h.dt}</div></div><div style="text-align:right"><b>${fmt(h.tot)}</b><br><button class="x" style="color:var(--ac)" data-p="${i}">Re-share</button></div></div>`).join(''):'<div class="card sub">No invoices yet.</div>'}
$('hl').addEventListener('click',e=>{const p=e.target.dataset.p;if(p!==undefined)share(hist[+p])});
function rgb(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function build(v){const LOGO=document.getElementById('lg');
 const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'pt',format:'a4'});const W=595,M=40,c=rgb(biz.col||'#1f6feb');
 const money=n=>(biz.cur||'')+' '+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 d.addImage(LOGO,'PNG',M,28,170,Math.round(170*739/3274*100)/100*1);d.setFillColor(...c);d.rect(0,82,W,5,'F');d.setTextColor(...c);d.setFont('helvetica','bold');d.setFontSize(26);d.text('INVOICE',W-M,56,{align:'right'});
 d.setTextColor(40);d.setFontSize(10);d.setFont('helvetica','normal');
 let y=118;const bl=[biz.name,biz.addr,biz.email,biz.phone].filter(Boolean).join('\n').split('\n');bl.forEach(l=>{d.text(l,M,y);y+=13});
 d.setFont('helvetica','bold');d.text('Invoice no:',360,118);d.text('Date:',360,133);d.text('Due:',360,148);
 d.setFont('helvetica','normal');d.text(v.no,430,118);d.text(v.dt,430,133);d.text(v.due,430,148);
 y=Math.max(y,160)+18;d.setFont('helvetica','bold');d.setTextColor(...c);d.text('BILL TO',M,y);y+=14;d.setTextColor(40);d.text(v.cl||'-',M,y);d.setFont('helvetica','normal');
 (v.ca||'').split('\n').forEach(l=>{y+=13;d.text(l,M,y)});
 y+=28;d.setFillColor(...c);d.rect(M,y-13,W-2*M,22,'F');d.setTextColor(255);d.setFont('helvetica','bold');
 d.text('Description',M+8,y+2);d.text('Qty',330,y+2,{align:'right'});d.text('Price',430,y+2,{align:'right'});d.text('Amount',W-M-8,y+2,{align:'right'});
 d.setTextColor(40);d.setFont('helvetica','normal');y+=26;
 v.items.forEach(i=>{if(y>740){d.addPage();y=60}const q=+i.q||0,p=+i.p||0;const ls=d.splitTextToSize(i.d||'',250);d.text(ls,M+8,y);d.text(String(q),330,y,{align:'right'});d.text(money(p),430,y,{align:'right'});d.text(money(q*p),W-M-8,y,{align:'right'});y+=Math.max(ls.length,1)*13+8;d.setDrawColor(220);d.line(M,y-9,W-M,y-9)});
 const sub=v.items.reduce((a,i)=>a+(+i.q||0)*(+i.p||0),0),tx=sub*v.tax/100;
 if(y>680){d.addPage();y=60}
 y+=8;d.text('Subtotal',380,y);d.text(money(sub),W-M-8,y,{align:'right'});y+=16;d.text('Tax ('+v.tax+'%)',380,y);d.text(money(tx),W-M-8,y,{align:'right'});y+=20;
 d.setFont('helvetica','bold');d.setFontSize(13);d.setTextColor(...c);d.text('Total',380,y);d.text(money(sub+tx),W-M-8,y,{align:'right'});
 d.setFontSize(10);d.setTextColor(40);y+=34;
 if(biz.pay){d.text('Payment details',M,y);d.setFont('helvetica','normal');biz.pay.split('\n').forEach(l=>{y+=13;d.text(l,M,y)});y+=20;d.setFont('helvetica','bold')}
 if(v.nt){d.text('Notes',M,y);d.setFont('helvetica','normal');d.splitTextToSize(v.nt,W-2*M).forEach(l=>{y+=13;d.text(l,M,y)})}
 return d.output('blob')}
async function share(v){
 if(!window.jspdf){toast('PDF library not loaded. Check your connection.');return}
 const blob=build(v),name=(v.no||'invoice')+(v.cl?'-'+v.cl.replace(/[^\w]+/g,'-'):'')+'.pdf';
 try{const dl=await claude.use('downloads');
  if(dl){await dl.save({filename:name,data:blob});toast('PDF ready');return}
 }catch(e){if(e&&e.code==='declined')return}
 try{const f=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 toast('Sharing is not available in this view')}
$('pdf').onclick=async()=>{
 const v=snap();if(!v.items.length){toast('Add at least one item');return}
 if(!biz.name)toast('Tip: add your business details in the My business tab');
 await share(v);
 if(!hist.find(h=>h.no===v.no)){hist.unshift(v);hist=hist.slice(0,50);sv('ip_hist',hist);seq++;sv('ip_seq',seq)}
 else{hist=hist.map(h=>h.no===v.no?v:h);sv('ip_hist',hist)}}
loadBiz();newInv();
</script>
</body>
</html>
